      <rect x="20" y="22" width="56" height="66" rx="12" fill="#ffffff" fill-opacity="0.05" stroke="#b57bff" stroke-opacity="0.45"/>
      <text class="mono" x="48" y="64" font-size="22" font-weight="700" fill="url(#name)" text-anchor="middle">01</text>
      <text class="sans" x="96" y="46" font-size="16" fill="#8d95c9">Currently focused on</text>
      <text class="sans" x="96" y="78" font-size="25" font-weight="600" fill="#e6e9ff">Java &amp; Spring Boot development</text>
