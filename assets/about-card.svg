      <text class="mono" x="48" y="64" font-size="22" font-weight="700" fill="url(#name)" text-anchor="middle">02</text>
      <text class="sans" x="96" y="46" font-size="16" fill="#8d95c9">Expanding my knowledge in</text>
      <text class="sans" x="96" y="78" font-size="25" font-weight="600" fill="#e6e9ff">Full-Stack Development</text>
    </g>
    <g class="in" style="animation-delay:0.3s" transform="translate(0,130)">
      <rect width="590" height="110" rx="16" fill="url(#bg)" stroke="#8ea2ff" stroke-opacity="0.25"/>
      <rect x="20" y="22" width="56" height="66" rx="12" fill="#ffffff" fill-opacity="0.05" stroke="#b57bff" stroke-opacity="0.45"/>
      <text class="mono" x="48" y="64" font-size="22" font-weight="700" fill="url(#name)" text-anchor="middle">03</text>
      <text class="sans" x="96" y="46" font-size="16" fill="#8d95c9">I regularly write articles on</text>
      <text class="sans" x="96" y="78" font-size="25" font-weight="600" fill="#e6e9ff">my WordPress blog</text>
    </g>
    <g class="in" style="animation-delay:0.44999999999999996s" transform="translate(610,130)">
      <rect width="590" height="110" rx="16" fill="url(#bg)" stroke="#8ea2ff" stroke-opacity="0.25"/>
      <rect x="20" y="22" width="56" height="66" rx="12" fill="#ffffff" fill-opacity="0.05" stroke="#b57bff" stroke-opacity="0.45"/>
      <text class="mono" x="48" y="64" font-size="22" font-weight="700" fill="url(#name)" text-anchor="middle">04</text>
      <text class="sans" x="96" y="46" font-size="16" fill="#8d95c9">Reach me at</text>
      <text class="sans" x="96" y="78" font-size="25" font-weight="600" fill="#e6e9ff">shasan5525@gmail.com</text>
