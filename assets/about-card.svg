<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 240" width="1200" height="240" role="img" aria-label="About Shahriar Hasan" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b0d17"/><stop offset="1" stop-color="#1a1033"/></linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8ea2ff"/><stop offset="0.55" stop-color="#b57bff"/><stop offset="1" stop-color="#ff8fd8"/></linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#667eea"/><stop offset="1" stop-color="#b57bff"/></linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#667eea" stop-opacity="0"/><stop offset="0.5" stop-color="#b57bff" stop-opacity="0.9"/><stop offset="1" stop-color="#ff8fd8" stop-opacity="0"/></linearGradient>
  </defs>
  <style>
    .sans { font-family: 'Segoe UI','Helvetica Neue',Arial,sans-serif; }
    .mono { font-family: 'Fira Code','JetBrains Mono','SF Mono',Consolas,monospace; }
    @keyframes rise { from { opacity:0; transform:translateY(8px);} to { opacity:1; transform:translateY(0);} }
    @keyframes sweep { from { transform: translateX(-200px) skewX(-20deg);} to { transform: translateX(1500px) skewX(-20deg);} }
    @keyframes pulse { 0%,100% { opacity:.35;} 50% { opacity:1;} }
    .in { animation: rise .7s ease-out backwards; }
    .shine { animation: sweep 7s linear 1s infinite; }
    .dot { animation: pulse 2.4s ease-in-out infinite; }
  </style>

  <g>
