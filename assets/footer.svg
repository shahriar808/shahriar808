<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 140" width="1200" height="140" role="img" aria-label="Thanks for visiting" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b0d17"/><stop offset="1" stop-color="#1a1033"/></linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8ea2ff"/><stop offset="0.55" stop-color="#b57bff"/><stop offset="1" stop-color="#ff8fd8"/></linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#667eea"/><stop offset="1" stop-color="#b57bff"/></linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#667eea" stop-opacity="0"/><stop offset="0.5" stop-color="#b57bff" stop-opacity="0.9"/><stop offset="1" stop-color="#ff8fd8" stop-opacity="0"/></linearGradient>
  </defs>
  <style>
    .sans { font-family: 'Segoe UI','Helvetica Neue',Arial,sans-serif; }
    .mono { font-family: 'Fira Code','JetBrains Mono','SF Mono',Consolas,monospace; }
    @keyframes rise { from { opacity:0; transform:translateY(8px);} to { opacity:1; transform:translateY(0);} }
    @keyframes sweep { from { transform: translateX(-200px) skewX(-20deg);} to { transform: translateX(1500px) skewX(-20deg);} }
    @keyframes pulse { 0%,100% { opacity:.35;} 50% { opacity:1;} }
    .in { animation: rise .7s ease-out backwards; }
    .shine { animation: sweep 7s linear 1s infinite; }
    .dot { animation: pulse 2.4s ease-in-out infinite; }
  </style>

  <clipPath id="c"><rect width="1200" height="140" rx="24"/></clipPath>
  <g clip-path="url(#c)">
    <rect width="1200" height="140" fill="url(#bg)"/>
    <circle cx="150" cy="140" r="200" fill="#667eea" opacity="0.18"/>
    <circle cx="1050" cy="0" r="200" fill="#ff6ec7" opacity="0.14"/>
    <rect class="shine" x="0" y="0" width="100" height="140" fill="#fff" opacity="0.035"/>
    <text class="in sans" x="600" y="64" font-size="30" font-weight="700" fill="url(#name)" text-anchor="middle">Thanks for visiting</text>
    <text class="in mono" x="600" y="98" font-size="16" fill="#8d95c9" text-anchor="middle">&lt;/ Shahriar Hasan &gt;  Java Developer | Bangladesh</text>
  </g>
  <rect x="1" y="1" width="1198" height="138" rx="24" fill="none" stroke="#8ea2ff" stroke-opacity="0.25"/>
</svg>