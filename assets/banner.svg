<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-label="Shahriar Hasan - Java Developer, Spring Boot, Bangladesh" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0d17"/>
      <stop offset="1" stop-color="#1a1033"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8ea2ff"/>
      <stop offset="0.55" stop-color="#b57bff"/>
      <stop offset="1" stop-color="#ff8fd8"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#667eea"/>
      <stop offset="1" stop-color="#764ba2"/>
    </linearGradient>
    <radialGradient id="orbA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#667eea" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#667eea" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff6ec7" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ff6ec7" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="card"><rect width="1200" height="420" rx="24"/></clipPath>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <style>
    .sans { font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; }
    .mono { font-family: 'Fira Code', 'JetBrains Mono', 'SF Mono', Consolas, monospace; }
    @keyframes floatA { 0%,100% { transform: translate(0,0); } 50% { transform: translate(30px,22px); } }
    @keyframes floatB { 0%,100% { transform: translate(0,0); } 50% { transform: translate(-34px,-18px); } }
    @keyframes rise   { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes line   { from { opacity: 0; transform: translateX(-10px); } to { opacity: 1; transform: translateX(0); } }
    @keyframes blink  { 0%,49% { opacity: 1; } 50%,100% { opacity: 0; } }
    @keyframes sweep  { from { transform: translateX(-300px); } to { transform: translateX(1500px); } }
    .orbA { animation: floatA 9s ease-in-out infinite; }
    .orbB { animation: floatB 11s ease-in-out infinite; }
    .r1 { animation: rise .8s ease-out .1s backwards; }
    .r2 { animation: rise .8s ease-out .3s backwards; }
    .r3 { animation: rise .8s ease-out .5s backwards; }
    .r4 { animation: rise .8s ease-out .7s backwards; }
    .l1 { animation: line .5s ease-out 1.0s backwards; }
    .l2 { animation: line .5s ease-out 1.3s backwards; }
    .l3 { animation: line .5s ease-out 1.6s backwards; }
    .l4 { animation: line .5s ease-out 1.9s backwards; }
    .l5 { animation: line .5s ease-out 2.2s backwards; }
    .cursor { animation: blink 1s steps(1) infinite; }
    .shine { animation: sweep 6s linear 2.5s infinite; }
  </style>

  <g clip-path="url(#card)">
    <rect width="1200" height="420" fill="url(#bg)"/>

    <!-- soft glowing orbs -->
    <circle class="orbA" cx="180" cy="90" r="260" fill="url(#orbA)"/>
    <circle class="orbB" cx="1020" cy="360" r="280" fill="url(#orbB)"/>

    <!-- subtle dot grid -->
    <g fill="#ffffff" opacity="0.06">
      <g id="row">
        <circle cx="40" cy="40" r="1.6"/><circle cx="80" cy="40" r="1.6"/><circle cx="120" cy="40" r="1.6"/><circle cx="160" cy="40" r="1.6"/><circle cx="200" cy="40" r="1.6"/><circle cx="240" cy="40" r="1.6"/><circle cx="280" cy="40" r="1.6"/><circle cx="320" cy="40" r="1.6"/><circle cx="360" cy="40" r="1.6"/><circle cx="400" cy="40" r="1.6"/><circle cx="440" cy="40" r="1.6"/><circle cx="480" cy="40" r="1.6"/><circle cx="520" cy="40" r="1.6"/><circle cx="560" cy="40" r="1.6"/><circle cx="600" cy="40" r="1.6"/><circle cx="640" cy="40" r="1.6"/><circle cx="680" cy="40" r="1.6"/><circle cx="720" cy="40" r="1.6"/><circle cx="760" cy="40" r="1.6"/><circle cx="800" cy="40" r="1.6"/><circle cx="840" cy="40" r="1.6"/><circle cx="880" cy="40" r="1.6"/><circle cx="920" cy="40" r="1.6"/><circle cx="960" cy="40" r="1.6"/><circle cx="1000" cy="40" r="1.6"/><circle cx="1040" cy="40" r="1.6"/><circle cx="1080" cy="40" r="1.6"/><circle cx="1120" cy="40" r="1.6"/><circle cx="1160" cy="40" r="1.6"/>
      </g>
      <use href="#row" y="40"/><use href="#row" y="80"/><use href="#row" y="120"/><use href="#row" y="160"/><use href="#row" y="200"/><use href="#row" y="240"/><use href="#row" y="280"/><use href="#row" y="320"/><use href="#row" y="360"/>
    </g>

    <!-- LEFT: identity -->
    <g class="sans">
      <g class="r1">
        <rect x="70" y="78" width="250" height="34" rx="17" fill="#ffffff" fill-opacity="0.07" stroke="#8ea2ff" stroke-opacity="0.45"/>
        <circle cx="92" cy="95" r="5" fill="#4ade80"/>
        <text x="108" y="100" font-size="15" fill="#d6dcff" class="mono">welcome to my github</text>
      </g>

      <text class="r2" x="68" y="180" font-size="30" fill="#aab4e8" font-weight="500">Hi, I'm</text>
      <text class="r2" x="66" y="262" font-size="84" font-weight="800" fill="url(#name)" letter-spacing="-2">Shahriar Hasan</text>
      <rect class="r3" x="70" y="282" width="150" height="5" rx="2.5" fill="url(#bar)"/>

      <text class="r3" x="70" y="332" font-size="26" fill="#e6e9ff" font-weight="500">Java Developer <tspan fill="#667eea">•</tspan> Spring Boot Expert <tspan fill="#764ba2">•</tspan> Problem Solver</text>
      <text class="r4 mono" x="70" y="374" font-size="17" fill="#8d95c9">📍 Bangladesh</text>
    </g>

    <!-- RIGHT: floating code window -->
    <g filter="url(#shadow)" class="r2">
      <rect x="740" y="86" width="400" height="248" rx="16" fill="#0f1224" stroke="#8ea2ff" stroke-opacity="0.3"/>
      <rect x="740" y="86" width="400" height="40" rx="16" fill="#171b36"/>
      <rect x="740" y="110" width="400" height="16" fill="#171b36"/>
      <circle cx="768" cy="106" r="6" fill="#ff5f56"/>
      <circle cx="790" cy="106" r="6" fill="#ffbd2e"/>
      <circle cx="812" cy="106" r="6" fill="#27c93f"/>
      <text x="940" y="111" font-size="13" fill="#7f88c0" class="mono" text-anchor="middle">Shahriar.java</text>

      <g class="mono" font-size="17">
        <text class="l1" x="766" y="162"><tspan fill="#c792ea">class</tspan> <tspan fill="#ffd479">Shahriar</tspan> <tspan fill="#9aa5d8">{</tspan></text>
        <text class="l2" x="790" y="196"><tspan fill="#82aaff">role</tspan>  <tspan fill="#9aa5d8">=</tspan> <tspan fill="#a5e075">"Java Developer"</tspan><tspan fill="#9aa5d8">;</tspan></text>
        <text class="l3" x="790" y="228"><tspan fill="#82aaff">stack</tspan> <tspan fill="#9aa5d8">=</tspan> <tspan fill="#a5e075">"Spring Boot"</tspan><tspan fill="#9aa5d8">;</tspan></text>
        <text class="l4" x="790" y="260"><tspan fill="#82aaff">from</tspan>  <tspan fill="#9aa5d8">=</tspan> <tspan fill="#a5e075">"Bangladesh"</tspan><tspan fill="#9aa5d8">;</tspan></text>
        <text class="l5" x="766" y="298"><tspan fill="#9aa5d8">}</tspan><tspan class="cursor" fill="#b57bff"> ▍</tspan></text>
      </g>
    </g>

    <!-- light sweep -->
    <rect class="shine" x="0" y="0" width="120" height="420" fill="#ffffff" opacity="0.02" transform="skewX(-20)"/>
  </g>
  <rect x="1" y="1" width="1198" height="418" rx="24" fill="none" stroke="#8ea2ff" stroke-opacity="0.25"/>
</svg>
